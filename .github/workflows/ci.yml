name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      # The release deployment must not silently select a planning-only image, which lacks the
      # git/ssh/flock runtime and refuses to start with releases enabled.
      - name: Release Compose requires an explicit release-capable image
        run: |
          if docker compose -f docker-compose.release.yml config >/dev/null 2>&1; then
            echo '::error::docker-compose.release.yml rendered without EV_IMAGE; it must refuse a default image'
            exit 1
          fi
          EV_IMAGE=ghcr.io/brunoorsolon/forge-desk:test docker compose -f docker-compose.release.yml config >/dev/null
      - run: bash scripts/smoke-test.sh

  forge-integration:
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        image:
          - gitea/gitea:1.25
          - gitea/gitea:1.26.1
          - codeberg.org/forgejo/forgejo:11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/forge-integration.sh ${{ matrix.image }}
