# Publishes the Docker image to GHCR and creates the GitHub Release for a version.
#
# Triggers:
# - pushing a tag vX.Y.Z (git tag v1.2.3 && git push origin v1.2.3): verify, publish
#   the image, then create the GitHub Release (notes from .github/release-notes/vX.Y.Z.md
#   if present, plus GitHub's generated notes);
# - publishing a release in the GitHub UI (which creates the tag): verify and publish
#   the image; the release already exists;
# - manual run (Actions → Release → Run workflow): a dry run that verifies and builds
#   the multi-arch image without pushing anything.
name: Release

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches package.json
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$pkg" ]]; then
              echo "::error::Tag $tag does not match package.json version $pkg (expected v$pkg)"
              exit 1
            fi
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - name: Docker smoke test
        run: bash scripts/smoke-test.sh

  publish-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dry-run,enable=${{ github.event_name == 'workflow_dispatch' }}
          # latest only for stable vX.Y.Z tags (never for prereleases or dry runs)
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=execution-view
            org.opencontainers.image.description=Deterministic dependency graph and execution order for open GitHub/Gitea issues
            org.opencontainers.image.licenses=MIT
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [verify, publish-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          notes="$(mktemp)"
          if [[ -f ".github/release-notes/$TAG.md" ]]; then
            cat ".github/release-notes/$TAG.md" > "$notes"
          fi
          {
            echo
            echo "## Docker image"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:${TAG#v}"
            echo '```'
          } >> "$notes"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes" --generate-notes
