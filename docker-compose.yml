# execution-view with the published image. Quick start: see "Run with docker compose"
# in README.md. Settings and tokens come from .env (see .env.example).
services:
  execution-view:
    # :1 follows the latest 1.x release. Pin a version (e.g. :1.0.0) for fully
    # reproducible deployments. To build from source instead, replace this line
    # with `build: .`.
    image: ghcr.io/brunoorsolon/execution-view:1
    ports:
      - '8080:8080'
    # Env-only mode (EV_PROVIDER, EV_REPOS, ...) and tokens. Requires Compose >= 2.24
    # for `required: false`.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

    # Config-file mode (several repos or views, priority labels, scope filters,
    # basic auth, webhooks): create config.yaml from config.example.yaml first,
    # then uncomment. Do not uncomment before the file exists: Docker would
    # create a directory named config.yaml instead.
    # volumes:
    #   - ./config.yaml:/app/config.yaml:ro
